# Hugo configuration file
title: Holstad Volleyball

# Må stå her, ikke bare som --baseURL-flagg: produksjonsbygget går via
# Dockerfile (`hugo --minify`), som ikke setter flagget. Uten den blir
# canonical, og:url, sitemap.xml og llms.txt relative/localhost.
baseURL: "https://holstadvolley.com/"

# Gir .Lastmod fra git-historikken, som mater article:modified_time og
# dateModified i JSON-LD. Krever .git i byggekonteksten (Kaniko henter
# repoet med fetch-depth: 0, så den er der).
enableGitInfo: true

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Nyheter
      pageRef: /nyheter
      weight: 1
    - name: Lag og treningstider
      pageRef: /lag
      weight: 1
    - name: Priser
      pageRef: /priser
      weight: 1
    - name: Bli medlem
      pageRef: /bli-medlem
      weight: 2
    - name: Støtt Holstad
      pageRef: /stotte
      weight: 2
    - name: For Trenere
      pageRef: /trener
      weight: 2
    - name: Klubbtøy ↗
      url: "/klubbtoy"
      weight: 3
    - name: Søk
      weight: 4
      params:
        type: search

params:
  # Brukes av forsidens meta description, og:description og av innledningen
  # i llms.txt. Uten den blir alle tre tomme.
  description: >-
    Holstad Volleyball er volleyballgruppa i Holstad IL i Ås kommune. Over 300
    spillere fra Tullball i barnehagealder til senior, med treninger på Åsgård
    skole og i Åshallen.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.svg
      dark: logo.svg
      link: /
      width: 80
      height: 20

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

outputs:
  home: [html, llms]
