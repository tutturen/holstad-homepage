# Production k3s deployment for holstad-homepage, running on the `production`
# host's own k3s cluster (see ~/dev/sindre/infra-self-hosted's k3s notes).
# NOT yet wired into live traffic -- Caddy's real holstadvolley.com route
# still points at the Dokku app. Ingress host below matches Dokku's existing
# internal-only holstad-homepage.sindres.no alias (tls internal in Caddy),
# purely so this can be smoke-tested the same way Dokku's copy is.
#
# The image tag here is a floating bootstrap reference -- deploy-main.yaml
# takes over the image field on every push to main via `kubectl set image`
# (see infra-self-hosted/scripts/k3s-deploy-webhook.py), pinning it to a
# specific main-<sha> tag. imagePullPolicy must stay IfNotPresent/Always
# (not Never) or kubectl set image's rollout will hang forever on
# ErrImageNeverPull once it points at a registry tag not yet cached locally.
#
# The `forgejo-registry` imagePullSecret is created out-of-band with kubectl
# (not committed here, since it holds a credential).
apiVersion: v1
kind: Namespace
metadata:
  name: holstad-homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holstad-homepage
  namespace: holstad-homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holstad-homepage
  template:
    metadata:
      labels:
        app: holstad-homepage
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: holstad-homepage
          image: forgejo.sindres.no/holstad/holstad-homepage:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: holstad-homepage
  namespace: holstad-homepage
spec:
  selector:
    app: holstad-homepage
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holstad-homepage
  namespace: holstad-homepage
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: holstad-homepage.sindres.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holstad-homepage
                port:
                  number: 80
