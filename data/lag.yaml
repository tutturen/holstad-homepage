  - navn: "Diamantvolley"
    kjonn: [jente, gutt]
    tilrettelagt: true
    beskrivelse: "Diamantvolley er trening for spillere med utviklingshemning."
    treninger:
      - dag: "Torsdag"
        tid: "17:00 - 18:00"
        sted: "Åsgård Skole"
    trener: "Informasjon kommer"

