# Single source of truth for lagene i klubben.
#
# Brukes av:
#   - lagvelger (interaktiv "hvilket lag passer for meg?" på forsiden)
#   - lagliste (lag-oversikten på /lag, kalles med prosent-form)
#
# ---------------------------------------------------------------------------
# VEDLIKEHOLD VED NY SESONG
# Fødselsårene er hardkodet. Når ny sesong starter må hvert lag flyttes ett år:
# fodselsaarFra/Til økes med 1 (f.eks. J15 2011-2012 -> 2012-2013).
# Husk også å oppdatere `sesong` under, og treningstidene i content/lag.md.
#
# Klassetrinn -> fødselsår for sesongen 2026/2027 (1. klasse = født 2020):
#   1.kl 2020 | 2.kl 2019 | 3.kl 2018 | 4.kl 2017
#   5.kl 2016 | 6.kl 2015 | 7.kl 2014 | 8.kl 2013 | 9.kl 2012
# ---------------------------------------------------------------------------

sesong: "2026/2027"

# Fallback for Spond-påmelding: brukes av lag som ikke har eget skjema.
# Lag med eget skjema setter `spond: "<url>"` på seg selv (se Tullball).
spondUrl: "https://club.spond.com/landing/signup/holstadvolleybal/form/CA87448637DC410784B95B47C69735EB"

# Felt per lag:
#   navn            påkrevd
#   niva            valgfri, f.eks. "5. divisjon"
#   trinn           valgfri, vises som "Barnehage opp til 2. klasse"
#   fodselsaarFra   eldste fødselsår som matcher (default 1900)
#   fodselsaarTil   yngste fødselsår som matcher (default 2100)
#   kjonn           [jente, gutt] - hvilke valg i velgeren som treffer laget
#   malgruppe       overstyrer ordet i "For <malgruppe> født ..." i lagvelgeren.
#                   Utledes fra kjonn (jenter / gutter / jenter og gutter) hvis
#                   den ikke er satt - sett den på seniorlag: damer, herrer
#   sekundaer       true = vises som "passer også" i velgeren, aldri som hovedtreff
#   tilrettelagt    true = holdes helt utenfor alder/kjønn-matchingen. Vises i stedet
#                   som en egen lenke under resultatet ("tilrettelagt trening")
#   beskrivelse     valgfri fritekst
#   merknad         valgfri liten note (vises kursivt)
#   treninger       liste av {dag, tid, sted}
#   trener, lagkontakt
#   lenke, lenketekst  valgfri lenke til egen side

