# Single source of truth for lagene i klubben OG for treningstidene.
#
# Brukes av:
#   - lagvelger (interaktiv "hvilket lag passer for meg?" på forsiden)
#   - lagliste (lag-oversikten på /lag, kalles med prosent-form)
#   - timeplan (kalenderen over treningstider på /lag, kalles med prosent-form)
#
# ---------------------------------------------------------------------------
# VEDLIKEHOLD VED NY SESONG
# Fødselsårene er hardkodet. Når ny sesong starter må hvert lag flyttes ett år:
# fodselsaarFra/Til økes med 1 (f.eks. J15 2011-2012 -> 2012-2013).
# Husk også å oppdatere `sesong` under.
#
# Treningstidene vedlikeholdes KUN her — content/lag.md har ingen egne tabeller
# lenger, den kaller bare timeplan-shortcoden.
#
# Klassetrinn -> fødselsår for sesongen 2026/2027 (1. klasse = født 2020):
#   1.kl 2020 | 2.kl 2019 | 3.kl 2018 | 4.kl 2017
#   5.kl 2016 | 6.kl 2015 | 7.kl 2014 | 8.kl 2013 | 9.kl 2012
# ---------------------------------------------------------------------------

sesong: "2026/2027"

# Fallback for Spond-påmelding: brukes av lag som ikke har eget skjema.
# Lag med eget skjema setter `spond: "<url>"` på seg selv (se Tullball).
spondUrl: "https://club.spond.com/landing/signup/holstadvolleybal/form/CA87448637DC410784B95B47C69735EB"

# ---------------------------------------------------------------------------
# Haller og baner
#
# Rekkefølgen her styrer både kolonnerekkefølgen i timeplanen og hvilken hall
# som vises først. `bane` på en trening må matche et av navnene under, ellers
# feiler bygget.
#
# visBaneIKort styrer om banen nevnes på lagkortene (på /lag og på forsiden).
# I timeplanen vises banen uansett — det er hele poenget der. På Åsgård er
# fordelingen mellom banene tentativ, så den holdes utenfor kortene. I Åshallen
# er "gammel del" / "ny del" det eneste som skiller Tullballs to økter, så der
# må den med.
# ---------------------------------------------------------------------------
haller:
  - navn: "Åsgård Skole"
    baner: ["Bane 1", "Bane 2", "Bane 3"]
    visBaneIKort: false
  - navn: "Åshallen"
    baner: ["Gammel del", "Ny del"]
    visBaneIKort: true

# Ukedagene i visningsrekkefølge. `dag` på en trening må matche en av disse.
dager: ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag", "Søndag"]

# ---------------------------------------------------------------------------
# Bookinger som ikke er et av klubbens lag. Vises dempet i timeplanen, slik at
# hullene i planen er forklart. `type: apen` fremhever blokka i stedet
# (åpen hall er et tilbud folk kan møte opp på).
# ---------------------------------------------------------------------------
andreBookinger:
  - tekst: "Arrangement / Intern-turnering"
    dag: "Tirsdag"
    type: apen
    fra: "18:30"
    til: "20:00"
    sted: "Åsgård Skole"
    bane: ["Bane 1", "Bane 2"]

  - tekst: "Tirsdagstrimmen 25+"
    dag: "Tirsdag"
    type: apen
    fra: "20:00"
    til: "22:00"
    sted: "Åsgård Skole"
    bane: ["Bane 3"]

  - tekst: "Ås IL"
    dag: "Onsdag"
    fra: "17:00"
    til: "18:00"
    sted: "Åsgård Skole"
    bane: ["Bane 1", "Bane 2", "Bane 3"]

  - tekst: "Åpen hall"
    notat: "Treningssamling / diverse"
    type: apen
    dag: "Fredag"
    fra: "18:00"
    til: "20:00"
    sted: "Åsgård Skole"
    bane: ["Bane 1", "Bane 2", "Bane 3"]

# Felt per lag:
#   navn            påkrevd
#   niva            valgfri, f.eks. "5. divisjon"
#   trinn           valgfri, vises som "Barnehage opp til 2. klasse"
#   farge           lagets egen farge, brukt på blokkene i timeplanen og på
#                   venstrekanten av lagkortet. Enten et tall 0-359 (HSL-
#                   fargetone) eller et navn:
#                     rød oransje gul lime eplegrønn grønn teal cyan blå
#                     indigo lilla magenta rosa
#                   Utelates den, får laget en ledig tone automatisk.
#
#   fodselsaarFra   eldste fødselsår som matcher (default 1900)
#   fodselsaarTil   yngste fødselsår som matcher (default 2100)
#   kjonn           [jente, gutt] - hvilke valg i velgeren som treffer laget
#   malgruppe       overstyrer ordet i "For <malgruppe> født ..." i lagvelgeren.
#                   Utledes fra kjonn (jenter / gutter / jenter og gutter) hvis
#                   den ikke er satt - sett den på seniorlag: damer, herrer
#   sekundaer       true = vises som "passer også" i velgeren, aldri som hovedtreff
#   tilrettelagt    true = holdes helt utenfor alder/kjønn-matchingen. Vises i stedet
#                   som en egen lenke under resultatet ("tilrettelagt trening")
#   beskrivelse     valgfri fritekst
#   merknad         valgfri liten note (vises kursivt)
#   trener, lagkontakt
#   lenke, lenketekst  valgfri lenke til egen side
#
#   treninger       liste av økter:
#     dag           påkrevd, må finnes i `dager`
#     fra, til      påkrevd, "HH:MM"
#     sted          påkrevd, må matche en hall i `haller`
#     bane          påkrevd, ett banenavn eller en liste av banenavn (laget
#                   disponerer flere baner samtidig)
#     oppvarming    valgfrie minutter FØR `fra` som laget disponerer banen til
#                   oppvarming. Tegnes som et stripet felt i toppen av blokka
#     notat         valgfri kort presisering, f.eks. aldersgruppe
#
#   To lag på samme bane til nøyaktig samme tid tolkes som delt bane og tegnes
#   side om side. Delvis overlapp er derimot en kollisjon, og gir en advarsel i
#   bygget (se `hugo` sin logg) i tillegg til at blokkene deles.

lag:
  - navn: "Diamantvolley"
    kjonn: [jente, gutt]
    farge: 115  # blandet: gressgrønn
    tilrettelagt: true
    beskrivelse: "Diamantvolley er trening for spillere med utviklingshemning."
    treninger:
      - dag: "Torsdag"
        fra: "17:00"
        til: "18:00"
        sted: "Åsgård Skole"
        bane: "Bane 3"
    trener: "Informasjon kommer"

